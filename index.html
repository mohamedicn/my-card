<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Ibrahim - Profile Card</title>

    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: rgba(22, 27, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-purple: #a855f7;
            --vf-cash: #e11d48;
            --instapay: #8b5cf6;
            --bank-color: #3b82f6;
            --radius-lg: 24px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Profile Card Wrapper */
        .card-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeInCard 0.8s ease-out forwards;
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 1. Profile Image */
        .profile-img-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 20px;
            animation: floatImage 4s ease-in-out infinite;
        }

        @keyframes floatImage {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3.5px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 25px var(--primary-glow),
                        0 10px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease;
        }

        .profile-img-wrapper:hover .profile-img {
            transform: scale(1.04);
            border-color: var(--primary);
        }

        /* Typewriter Cursor Base */
        .typewriter-text {
            font-family: 'Inter', 'Cairo', sans-serif;
            position: relative;
            display: inline-block;
            white-space: pre-wrap;
            direction: ltr;
        }

        /* Cursor Styling */
        .cursor::after {
            content: '|';
            position: relative;
            margin-left: 2px;
            color: var(--primary);
            animation: blink 0.8s infinite;
        }
        
        .cursor.rtl-cursor::after {
            margin-left: 0;
            margin-right: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 2. Name */
        .profile-name {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            min-height: 36px;
            margin-bottom: 4px;
        }

        /* 3. Title */
        .profile-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary);
            min-height: 26px;
            margin-bottom: 16px;
            letter-spacing: 0.2px;
        }

        /* 4. Arabic Bio */
        .profile-bio {
            font-size: 0.92rem;
            color: var(--text-muted);
            min-height: 48px;
            line-height: 1.6;
            margin-bottom: 24px;
            direction: rtl;
            padding: 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Social & Contact Elements Delay Animation */
        .delayed-element {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            width: 100%;
        }

        .delayed-element.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 5. Social Links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-btn:hover {
            transform: translateY(-4px);
            border-color: transparent;
        }

        .social-btn.fb:hover { background: #1877f2; box-shadow: 0 5px 15px rgba(24, 119, 242, 0.4); }
        .social-btn.tw:hover { background: #000000; border-color: rgba(255,255,255,0.3); box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2); }
        .social-btn.ig:hover { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); box-shadow: 0 5px 15px rgba(220, 39, 67, 0.4); }
        .social-btn.li:hover { background: #0a66c2; box-shadow: 0 5px 15px rgba(10, 102, 194, 0.4); }

        /* 6. Contact Buttons */
        .contact-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 28px;
        }

        .contact-btn {
            width: 100%;
            height: 48px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .contact-btn i {
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        .contact-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .contact-btn:hover i {
            transform: scale(1.15);
        }

        .contact-btn.wa:hover { border-color: #25d366; color: #25d366; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.15); }
        .contact-btn.email:hover { border-color: #38bdf8; color: #38bdf8; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15); }
        .contact-btn.call:hover { border-color: #10b981; color: #10b981; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.15); }

        /* Divider */
        .section-divider {
            width: 100%;
            display: flex;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            padding: 0 14px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* 7. Payment Section */
        .payment-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .payment-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: right;
            transition: all 0.3s ease;
        }

        .payment-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .payment-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .payment-card.vf .payment-header { color: #f43f5e; }
        .payment-card.insta .payment-header { color: #a78bfa; }
        .payment-card.bank .payment-header { color: #60a5fa; }

        .number-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .number-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.12);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            direction: ltr;
        }

        .number-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--primary);
        }

        .number-item span {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .number-item i {
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .number-item:hover i {
            color: var(--primary);
        }

        .bank-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .bank-link:hover {
            background: rgba(59, 130, 246, 0.18);
            border-color: var(--bank-color);
            transform: translateY(-1px);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(40px);
            background: #10b981;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.88rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* Desktop Adjustments */
        @media (min-width: 600px) {
            .card-container {
                padding: 40px 28px;
            }
            .profile-img-wrapper {
                width: 190px;
                height: 190px;
            }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 1. Profile Image -->
        <div class="profile-img-wrapper">
            <img src="icn.jpg" alt="Mohamed Ibrahim" class="profile-img">
        </div>

        <!-- 2. Name -->
        <h1 class="profile-name">
            <span id="name-target" class="typewriter-text cursor"></span>
        </h1>

        <!-- 3. Title -->
        <p class="profile-title">
            <span id="title-target" class="typewriter-text"></span>
        </p>

        <!-- 4. Arabic Bio Animated Loop -->
        <div class="profile-bio">
            <span id="bio-target" class="typewriter-text rtl-cursor"></span>
        </div>

        <!-- Delayed Container for Remaining Elements -->
        <div class="delayed-element" id="delayed-content">
            
            <!-- 5. Social Links -->
            <div class="social-links">
                <a href="http://facebook.com/mohamedicn" target="_blank" class="social-btn fb" aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://x.com/MohamedIbr8341" target="_blank" class="social-btn tw" aria-label="X">
                    <i class="fab fa-x-twitter"></i>
                </a>
                <a href="https://www.instagram.com/icn.eg/" target="_blank" class="social-btn ig" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.linkedin.com/in/mohamed-icn-11917523a/" target="_blank" class="social-btn li" aria-label="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
            </div>

            <!-- 6. WhatsApp / Email / Call -->
            <div class="contact-group">
                <a href="https://wa.me/+201032431926" target="_blank" class="contact-btn wa">
                    <i class="fab fa-whatsapp"></i>
                    <span>WhatsApp</span>
                </a>
                <a href="mailto:mohamedicn@qq.co" class="contact-btn email">
                    <i class="far fa-envelope"></i>
                    <span>Email</span>
                </a>
                <a href="tel:+201032431926" class="contact-btn call">
                    <i class="fas fa-phone-alt"></i>
                    <span>Call</span>
                </a>
            </div>

            <!-- Divider -->
            <div class="section-divider">
                <span class="section-title">طرق الدفع</span>
            </div>

            <!-- 7. Payment Cards -->
            <div class="payment-section">
                
                <!-- Vodafone Cash -->
                <div class="payment-card vf">
                    <div class="payment-header">
                        <i class="fas fa-wallet"></i>
                        <span>Vodafone Cash</span>
                    </div>
                    <div class="number-list">
                        <div class="number-item" onclick="copyPaymentNumber('01032431926')">
                            <span>01032431926</span>
                            <i class="far fa-copy"></i>
                        </div>
                        <div class="number-item" onclick="copyPaymentNumber('01034101120')">
                            <span>01034101120</span>
                            <i class="far fa-copy"></i>
                        </div>
                    </div>
                </div>

                <!-- InstaPay -->
                <div class="payment-card insta">
                    <div class="payment-header">
                        <i class="fas fa-bolt"></i>
                        <span>InstaPay</span>
                    </div>
                    <div class="number-list">
                        <div class="number-item" onclick="copyPaymentNumber('01032431926')">
                            <span>01032431926</span>
                            <i class="far fa-copy"></i>
                        </div>
                        <div class="number-item" onclick="copyPaymentNumber('01034101120')">
                            <span>01034101120</span>
                            <i class="far fa-copy"></i>
                        </div>
                    </div>
                </div>

                <!-- Bank Account -->
                <div class="payment-card bank">
                    <div class="payment-header">
                        <i class="fas fa-university"></i>
                        <span>حساب بنكي</span>
                    </div>
                    <a href="mobank.pdf" target="_blank" class="bank-link">
                        <span>عرض بيانات الحساب البنكي</span>
                        <i class="fas fa-file-pdf"></i>
                    </a>
                </div>

            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span>تم نسخ الرقم ✓</span>
    </div>

    <script>
        // Data & Texts
        const nameText = "Mohamed Ibrahim";
        const titleText = "Web Developer & Designer";
        const bioPhrases = [
            "أحوّل الأفكار إلى تجارب ويب تفاعلية ومميزة.",
            "أهتم ببناء واجهات عصرية وسريعة وسهلة الاستخدام.",
            "أحب كتابة كود نظيف وتحويل الأفكار إلى منتجات حقيقية."
        ];

        // Elements
        const nameTarget = document.getElementById("name-target");
        const titleTarget = document.getElementById("title-target");
        const bioTarget = document.getElementById("bio-target");
        const delayedContent = document.getElementById("delayed-content");

        // Helper delay function
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        // 1. Single Typewriter Effect (Name & Title)
        async function typeOnce(element, text, speed = 80) {
            element.classList.add("cursor");
            for (let i = 0; i < text.length; i++) {
                element.textContent += text.charAt(i);
                await sleep(speed);
            }
            element.classList.remove("cursor");
        }

        // 2. Continuous Bio Animation (Type -> Wait -> Delete -> Repeat)
        async function startBioLoop() {
            bioTarget.classList.add("cursor");
            let index = 0;

            while (true) {
                let currentPhrase = bioPhrases[index];

                // Type phase
                for (let i = 0; i < currentPhrase.length; i++) {
                    bioTarget.textContent += currentPhrase.charAt(i);
                    await sleep(45);
                }

                // Wait phase (2.5 to 3 seconds)
                await sleep(2800);

                // Delete phase
                for (let i = currentPhrase.length; i > 0; i--) {
                    bioTarget.textContent = currentPhrase.substring(0, i - 1);
                    await sleep(25);
                }

                await sleep(300);
                index = (index + 1) % bioPhrases.length;
            }
        }

        // Main Execution Flow
        async function initAnimations() {
            // Step 1: Type Name
            await typeOnce(nameTarget, nameText, 70);
            
            // Step 2: Type Title
            titleTarget.classList.add("cursor");
            await typeOnce(titleTarget, titleText, 50);

            // Step 3: Show delayed content (Social & Payment sections)
            delayedContent.classList.add("visible");

            // Step 4: Start Arabic Bio loop
            startBioLoop();
        }

        // Reusable Copy Payment Function with Fallback
        function copyPaymentNumber(number) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(number)
                    .then(() => showToast())
                    .catch(() => fallbackCopy(number));
            } else {
                fallbackCopy(number);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        // Toast Trigger
        let toastTimeout;
        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove("show");
            }, 2200);
        }

        // Start animation sequence after DOM loads
        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(initAnimations, 300);
        });
    </script>
</body>
</html>
